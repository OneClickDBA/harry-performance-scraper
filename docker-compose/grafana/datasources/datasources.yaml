apiVersion: 1

datasources:
- name: PostgreSQL
  uid: PostgreSQL
  type: postgres
  url: postgres:5432
  isDefault: true
  access: proxy
  editable: true
  user: ${POSTGRES_USER}
  secureJsonData:
    password: ${POSTGRES_PASSWORD}
  jsonData:
    database: ${POSTGRES_DB}
    sslmode: disable
    postgresVersion: 1700
    timescaledb: false
