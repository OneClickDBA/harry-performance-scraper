---
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed release tag, for example v0.2.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate version, signature, and main ancestry
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi

          read -r tag_type tag_object < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          if [[ "${tag_type}" != "tag" ]]; then
            echo "Release tag ${TAG} must be an annotated tag" >&2
            exit 1
          fi

          read -r verified release_commit < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '[.verification.verified, .object.sha] | @tsv'
          )
          if [[ "${verified}" != "true" ]]; then
            echo "Release tag ${TAG} does not have a GitHub-verified signature" >&2
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "${release_commit}" ]]; then
            echo "Checked-out commit does not match ${TAG}" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "Release commit is not part of main" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test godror build
        run: go test ./...

      - name: Test go-ora build
        run: CGO_ENABLED=0 go test -tags goora ./...

  build-goora:
    name: Build go-ora ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
            format: tar
          - goos: linux
            goarch: arm64
            extension: ""
            format: tar
          - goos: windows
            goarch: amd64
            extension: .exe
            format: zip
          - goos: darwin
            goarch: amd64
            extension: ""
            format: tar
          - goos: darwin
            goarch: arm64
            extension: ""
            format: tar
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          name="harry-scraper-${VERSION}-${GOOS}-${GOARCH}-goora"
          package_dir="dist/${name}"
          mkdir -p "${package_dir}"

          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
            go build -tags goora \
              -ldflags "-X main.Version=${VERSION} -s -w" \
              -o "${package_dir}/harry-scraper${EXTENSION}" ./

          cp README.md LICENSE.txt THIRD_PARTY_LICENSES.txt TRADEMARKS.md \
            "${package_dir}/"

          if [[ "${FORMAT}" == "zip" ]]; then
            (
              cd dist
              zip -qr "${name}.zip" "${name}"
            )
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-goora-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  build-godror:
    name: Build godror EL${{ matrix.el }} ${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        el: [8, 9]
        arch: [amd64, arm64]
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build release archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          EL: ${{ matrix.el }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          binary_dir="$(mktemp -d "${RUNNER_TEMP}/harry-release-${EL}-${ARCH}.XXXXXX")"
          name="harry-scraper-${VERSION}-linux-${ARCH}-godror-el${EL}"
          package_dir="dist/${name}"

          # Older signed tags predate the binary-only export stage. Add it to
          # the build recipe without changing the tagged application source.
          if ! grep -q '^FROM scratch AS release-binary$' Dockerfile; then
            printf '\nFROM scratch AS release-binary\n\nCOPY --from=build /tmp/harry-scraper /harry-scraper\n' \
              >> Dockerfile
          fi

          docker buildx build \
            --platform "linux/${ARCH}" \
            --target release-binary \
            --build-arg "BASE_IMAGE=ghcr.io/oracle/oraclelinux:${EL}-slim" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "TAGS=godror" \
            --build-arg "CGO_ENABLED=1" \
            --output "type=local,dest=${binary_dir}" \
            .

          mkdir -p "${package_dir}"
          cp "${binary_dir}/harry-scraper" "${package_dir}/"
          cp README.md LICENSE.txt THIRD_PARTY_LICENSES.txt TRADEMARKS.md \
            "${package_dir}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-godror-el${{ matrix.el }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-container:
    name: Publish ${{ matrix.driver }} EL${{ matrix.el }} image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: godror
            el: 8
            cgo: 1
            target: scraper-godror
            default: true
          - driver: godror
            el: 9
            cgo: 1
            target: scraper-godror
            default: false
          - driver: goora
            el: 8
            cgo: 0
            target: scraper-goora
            default: false
          - driver: goora
            el: 9
            cgo: 0
            target: scraper-goora
            default: false
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DRIVER: ${{ matrix.driver }}
          EL: ${{ matrix.el }}
          DEFAULT_IMAGE: ${{ matrix.default }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          major="${VERSION%%.*}"
          minor="${VERSION%.*}"
          {
            echo "tags<<EOF"
            echo "${image}:v${VERSION}-${DRIVER}-el${EL}"
            echo "${image}:${VERSION}-${DRIVER}-el${EL}"
            if [[ "${DEFAULT_IMAGE}" == "true" ]]; then
              echo "${image}:v${VERSION}"
              echo "${image}:${VERSION}"
              echo "${image}:${minor}"
              echo "${image}:${major}"
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BASE_IMAGE=ghcr.io/oracle/oraclelinux:${{ matrix.el }}-slim
            VERSION=${{ needs.validate.outputs.version }}
            TAGS=${{ matrix.driver }}
            CGO_ENABLED=${{ matrix.cgo }}
          cache-from: type=gha,scope=${{ matrix.driver }}-el${{ matrix.el }}
          cache-to: type=gha,mode=max,scope=${{ matrix.driver }}-el${{ matrix.el }}

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - build-goora
      - build-godror
      - publish-container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum ./* > SHA256SUMS
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/* \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes
